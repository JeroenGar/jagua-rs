[package]
name = "jagua-rs"
version = "2.0.0"
edition = "2024"
rust-version = "1.90"
license = "MPL-2.0"
repository = "https://github.com/JeroenGar/jagua-rs"
authors = ["Jeroen Gardeyn"]
description = "A fast and fearless Collision Detection Engine for 2D irregular Cutting and Packing problems"
readme = "../README.md"
keywords = ["nesting", "packing", "strip", "bin", "irregular"]

[dependencies]
ndarray = {workspace = true}
rand_distr = {workspace = true}
getrandom = { workspace = true }
serde = {workspace = true}
ordered-float = { workspace = true }
log = {workspace = true}
slotmap = {workspace = true}
float-cmp = {workspace = true}
itertools = {workspace = true}
svg = {workspace = true}
anyhow = {workspace = true}
thiserror = {workspace = true}
document-features = {workspace = true}
rayon = { workspace = true }
geo-types = { workspace = true }
geo = { workspace = true }
web-time = { workspace = true }

[features]
## Enables support for the Strip Packing Problem
spp = []
## Enables support for the Bin Packing Problem
bpp = []

[lints.rust]
# Explicit SIMD in the collision queries, on nightly Rust: RUSTFLAGS="--cfg jagua_simd"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(jagua_simd)"] }

[package.metadata.docs.rs]
all-features = true
# rustdoc-args = ["--cfg", "docsrs"]
