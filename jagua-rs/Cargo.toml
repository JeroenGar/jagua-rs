[package]
name = "jagua-rs"
version = "2.0.0"
edition = "2024"
rust-version = "1.90"
license = "MPL-2.0"
repository = "https://github.com/JeroenGar/jagua-rs"
authors = ["Jeroen Gardeyn"]
description = "A fast and fearless Collision Detection Engine for 2D irregular Cutting and Packing problems"
readme = "../README.md"
keywords = ["nesting", "packing", "strip", "bin", "irregular"]
categories = ["algorithms", "mathematics", "science::geo"]

[dependencies]
serde = {workspace = true}
ordered-float = { workspace = true }
log = {workspace = true}
slotmap = {workspace = true}
float-cmp = {workspace = true}
itertools = {workspace = true}
svg = {workspace = true}
anyhow = {workspace = true}
thiserror = {workspace = true}
document-features = {workspace = true}
rayon = { workspace = true }
geo-types = { workspace = true }
geo = { workspace = true }

# Only needed on wasm32-unknown-unknown, where std::time::Instant is unavailable
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-time = { workspace = true }

[features]
## Enables support for the Strip Packing Problem
spp = []
## Enables support for the Bin Packing Problem
bpp = []

[package.metadata.docs.rs]
all-features = true
